name: CI

# Every push and every pull request runs three legs:
#
#   Windows PowerShell 5.1   windows-latest, shell: powershell
#   PowerShell 7 on Windows  windows-latest, shell: pwsh
#   PowerShell 7 on Ubuntu   ubuntu-latest,  shell: pwsh
#
# Each leg runs the Python suite (pytest), PSScriptAnalyzer with the committed
# settings, and the Pester suite for the EliteLab module (tests/pwsh).
# The Ubuntu leg uses Python 3.8, the oldest version the project supports.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
            python: '3.13'
          - name: PowerShell 7 on Windows
            os: windows-latest
            shell: pwsh
            python: '3.12'
          - name: PowerShell 7 on Ubuntu
            os: ubuntu-latest
            shell: pwsh
            python: '3.8'
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show the PowerShell and Python in use
        run: |
          "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition)) on $([System.Environment]::OSVersion.VersionString)"
          python --version

      - name: Probe (temporary, removed once all three legs are green)
        continue-on-error: true
        run: |
          function Invoke-Thing { 'args: ' + ($args -join '|') }
          Set-Alias thing Invoke-Thing
          Register-ArgumentCompleter -Native -CommandName thing, Invoke-Thing -ScriptBlock {
            param($w, $a, $c)
            'alpha', 'beta', '--gamma' | Where-Object { $_ -like "$w*" } | ForEach-Object { New-Object System.Management.Automation.CompletionResult $_, $_, 'ParameterValue', $_ }
          }
          foreach ($line in 'thing a', 'thing ', 'Invoke-Thing b', 'thing --', 'thing -', 'thing x -') {
            $r = TabExpansion2 -inputScript $line -cursorColumn $line.Length
            'native completer, function: <{0}> -> {1}' -f $line, (($r.CompletionMatches | ForEach-Object { $_.CompletionText } | Select-Object -First 4) -join ',')
          }
          function Invoke-Other { 'x' }
          Set-Alias other Invoke-Other
          function TabExpansion($line, $lastWord) { if ($line -match '^other\s') { 'delta', 'epsilon' | Where-Object { $_ -like "$lastWord*" } } }
          foreach ($line in 'other d', 'other ') {
            $r = TabExpansion2 -inputScript $line -cursorColumn $line.Length
            'legacy TabExpansion: <{0}> -> {1}' -f $line, (($r.CompletionMatches | ForEach-Object { $_.CompletionText } | Select-Object -First 4) -join ',')
          }
          Remove-Item Function:\TabExpansion
          function Show-Arg {
            for ($i = 0; $i -lt $args.Count; $i++) {
              $note = $null
              if ($null -ne $args[$i]) { $note = $args[$i].psobject.Properties['<CommandParameterName>'] }
              $type = 'null'
              if ($null -ne $args[$i]) { $type = $args[$i].GetType().Name }
              '  [{0}] <{1}> type={2} marked={3}' -f $i, ([string]$args[$i]), $type, ($null -ne $note)
            }
          }
          'args as a function sees them:'
          Show-Arg -o:x 0x10 1.0 007 80,443 -h '-o:' y -- z
          'console output encoding: {0} ({1})' -f [Console]::OutputEncoding.CodePage, [Console]::OutputEncoding.WebName
          'temp: ' + [System.IO.Path]::GetTempPath()
          Get-Command py, python3, python -CommandType Application -ErrorAction SilentlyContinue | ForEach-Object { 'on PATH: ' + $_.Path }

      - name: Python suite (pytest)
        run: |
          python -m pip install --disable-pip-version-check --quiet pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Pester and PSScriptAnalyzer
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.7.1
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          Get-Module -Name Pester, PSScriptAnalyzer | ForEach-Object { '{0} {1}' -f $_.Name, $_.Version }

      - name: PSScriptAnalyzer
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $files = @(Get-ChildItem -Path . -Recurse -File -Include *.ps1, *.psm1, *.psd1)
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $findings | Sort-Object ScriptName, Line |
            Format-Table -AutoSize -Wrap -Property ScriptName, Line, Severity, RuleName, Message |
            Out-String -Width 200
          "PSScriptAnalyzer {0}: {1} files analyzed, {2} findings" -f (Get-Module PSScriptAnalyzer).Version, $files.Count, $findings.Count
          if ($findings.Count -gt 0) { exit 1 }

      - name: Pester
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'tests/pwsh'
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $configuration
          "Pester {0}: {1} passed, {2} failed, {3} skipped, {4} not run, in {5:n0} s" -f (Get-Module Pester).Version, $result.PassedCount, $result.FailedCount, $result.SkippedCount, $result.NotRunCount, $result.Duration.TotalSeconds
          if ($result.Result -ne 'Passed' -or $result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { exit 1 }
